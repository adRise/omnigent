name: Harness CLI action pin consistency

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-consistency:
    name: Pinned callers match tested action
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          egress-policy: audit
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate setup action references
        shell: bash
        run: |
          set -euo pipefail
          action_pattern='omnigent-ai/omnigent/\.github/actions/setup-harness-cli'
          reference_pattern="${action_pattern}@[^[:space:]#\"']+"
          references=()
          while IFS= read -r reference; do
            references+=("$reference")
          done < <(git grep -h -o -E "$reference_pattern" \
            -- .github/actions .github/workflows | sort -u)

          if (( ${#references[@]} == 0 )); then
            echo "No setup-harness-cli callers found" >&2
            exit 1
          fi

          pins=()
          for reference in "${references[@]}"; do
            pin="${reference##*@}"
            if [[ ! "$pin" =~ ^[0-9a-f]{40}$ ]]; then
              echo "setup-harness-cli caller is not pinned to a full SHA: $reference" >&2
              exit 1
            fi
            pins+=("$pin")
          done

          unique_pins="$(printf '%s\n' "${pins[@]}" | sort -u)"
          if [[ "$(printf '%s\n' "$unique_pins" | grep -c .)" -ne 1 ]]; then
            echo "setup-harness-cli callers use different SHAs: $unique_pins" >&2
            exit 1
          fi

          pin="$unique_pins"
          git fetch --no-tags --depth=1 origin "$pin"
          git diff --exit-code "$pin" HEAD -- .github/actions/setup-harness-cli
