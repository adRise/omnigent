name: Demo Check Policy Test

on:
  pull_request:
    paths:
      - .github/workflows/demo-check.js
      - .github/workflows/demo-check.test.js
      - .github/workflows/demo-check-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-check-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          egress-policy: audit
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run demo policy unit test
        run: node .github/workflows/demo-check.test.js
